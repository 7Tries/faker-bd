services:
  db:
    image: postgres:16-alpine
    container_name: users_postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: users_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d users_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: users_flask_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: users_db
      DB_USER: admin
      DB_PASSWORD: secretpassword
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: